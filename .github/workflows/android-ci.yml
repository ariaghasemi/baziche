name: android-ci

on:
  push:
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Alias android-37 (platform-37 unpublished by Google; see docs/ENVIRONMENT_SETUP.md)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            for v in 36 35 34; do
              if [ -d "$SDK/platforms/android-$v" ]; then SRC="$v"; break; fi
            done
            if [ -z "${SRC:-}" ]; then echo "no android platform found in $SDK" >&2; exit 1; fi
            cp -r "$SDK/platforms/android-$SRC" "$SDK/platforms/android-37"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :game-shell:assembleDebug :runtime:test :editor:testDebugUnitTest :core:data:testDebugUnitTest :core:network:testDebugUnitTest --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: baziche-debug-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/game-shell/build/outputs/apk/debug/game-shell-debug.apk
          retention-days: 14


