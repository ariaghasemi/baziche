name: backend-ci

on:
  push:
    paths: ["backend/**", "shared/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "shared/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Tests
        working-directory: backend
        run: npm test
