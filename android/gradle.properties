# Baziche Gradle properties
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# Non-transitive R classes (AGP default, explicit for clarity)
android.nonTransitiveRClass=true

# API base URL override (no commit needed): put BAZICHE_API_URL in ~/.gradle/gradle.properties
# or local.properties. Debug default = localhost backend via emulator (10.0.2.2).
