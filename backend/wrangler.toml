# Baziche API — Cloudflare Workers config
# Secrets are NEVER stored here. Use: wrangler secret put <NAME>
# See docs/SECRETS.md for the full registry.

name = "baziche-api"
main = "src/index.ts"
compatibility_date = "2026-09-15"

# --- D1: TWO databases, one account (separated but connected via this API) ---
# baziche-auth: identity, sessions, plans, subscriptions, admin, audit
# baziche-data: projects, revisions, assets, builds, shards, agents
# Create: npm run db:create (or wrangler d1 create <name>), then paste ids below.

[[d1_databases]]
binding = "DB_AUTH"
database_name = "baziche-auth"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/auth"

[[d1_databases]]
binding = "DB_DATA"
database_name = "baziche-data"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/data"

# --- R2 (bytes) ---
[[r2_buckets]]
binding = "R2_PROJECTS"
bucket_name = "baziche-projects"

[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "baziche-assets"

[[r2_buckets]]
binding = "R2_BUILDS"
bucket_name = "baziche-builds"

# --- Non-secret vars ---
[vars]
ENVIRONMENT = "development"
ACCESS_TOKEN_TTL_SEC = "900"
REFRESH_TOKEN_TTL_SEC = "2592000"
REGISTRIES_VERSION = "1"
DEFAULT_TARGET_API = "36"
DEFAULT_MIN_API = "26"
MAX_PROJECT_JSON_BYTES = "5242880"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.production.vars]
ENVIRONMENT = "production"
